name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholders so env validation passes. CI never talks to a real service.
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-used-anywhere-real
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format, em-dash scan, lint, typecheck, test
        run: pnpm check

      - name: Migrations match the schema
        run: |
          pnpm db:generate
          test -z "$(git status --porcelain -- packages/db/migrations)"

      - name: Build
        run: pnpm build
